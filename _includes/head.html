<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
{% if page.noindex %}
<meta name="robots" content="noindex">
{% endif %}
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:title" content="{{ page.title | default: site.title | escape }}">
<meta property="og:description" content="{{ page.description | default: site.description | escape }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:site_name" content="{{ site.title | escape }}">
<meta property="og:locale" content="en_US">
<meta property="og:image" content="{{ '/assets/og/share-1200x630.png' | absolute_url }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="StandRight on Android: today's upright posture check-ins">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title | default: site.title | escape }}">
<meta name="twitter:description" content="{{ page.description | default: site.description | escape }}">
<meta name="twitter:image" content="{{ '/assets/og/share-1200x630.png' | absolute_url }}">
<meta name="twitter:image:alt" content="StandRight on Android: today's upright posture check-ins">
{% if page.url == '/' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",
  "name": "StandRight",
  "operatingSystem": "Android",
  "applicationCategory": "HealthApplication",
  "description": {{ page.description | default: site.description | jsonify }},
  "url": {{ '/' | absolute_url | jsonify }},
  "image": {{ '/assets/og/share-1200x630.png' | absolute_url | jsonify }},
  "downloadUrl": "https://play.google.com/store/apps/details?id=dev.cip.standright",
  "installUrl": "https://play.google.com/store/apps/details?id=dev.cip.standright",
  "offers": {
    "@type": "Offer",
    "price": "0",
    "priceCurrency": "USD"
  }
}
</script>
{% endif %}
{% if page.guide %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": {{ page.headline | jsonify }},
  "description": {{ page.description | jsonify }},
  "datePublished": "{{ page.date_published | date: '%Y-%m-%d' }}",
  "dateModified": "{{ page.updated | date: '%Y-%m-%d' }}",
  "author": {
    "@type": "Organization",
    "name": "StandRight",
    "url": {{ '/' | absolute_url | jsonify }}
  },
  "publisher": {
    "@type": "Organization",
    "name": "StandRight",
    "url": {{ '/' | absolute_url | jsonify }}
  },
  "mainEntityOfPage": {{ page.url | absolute_url | jsonify }}
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": {{ '/' | absolute_url | jsonify }}
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": "Guides",
      "item": {{ '/guides/' | absolute_url | jsonify }}
    },
    {
      "@type": "ListItem",
      "position": 3,
      "name": {{ page.breadcrumb | jsonify }},
      "item": {{ page.url | absolute_url | jsonify }}
    }
  ]
}
</script>
{% endif %}
<link rel="icon" href="{{ '/assets/mark.svg' | relative_url }}" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#F6F1EA; --surface:#FFFDFA; --hairline:#E4D9C9;
    --ink:#2A231D; --ink2:#6B5D50; --leaf-ink:#3F6B34; --leaf:#8FBF7F; --leaf-soft:#E7F0E1;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--canvas); color:var(--ink);
    font-family:Figtree,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:17px; line-height:1.65;
  }
  .wrap{max-width:44rem; margin:0 auto; padding:0 16px 96px}
  header{padding:56px 0 8px; display:flex; align-items:center; justify-content:space-between; gap:14px}
  header > a{display:flex; align-items:center; gap:14px; color:inherit; text-decoration:none}
  header nav a{color:var(--ink2); font-size:.95rem}
  header img{width:46px; height:46px; display:block}
  header .name{font-family:Outfit,sans-serif; font-weight:600; font-size:1.6rem; letter-spacing:-.01em}
  main{background:var(--surface); border:1px solid var(--hairline); border-radius:24px; padding:8px 28px 28px; margin-top:28px}
  h1,h2,h3{font-family:Outfit,sans-serif; font-weight:600; letter-spacing:-.01em; line-height:1.25}
  h1{font-size:2rem; margin:24px 0 8px}
  h2{font-size:1.25rem; margin:32px 0 8px}
  p,li{color:var(--ink2)}
  a{color:var(--leaf-ink); text-underline-offset:3px}
  a:hover{text-decoration-thickness:2px}
  hr{border:0; border-top:1px solid var(--hairline); margin:32px 0}
  code{background:var(--canvas); padding:2px 6px; border-radius:6px; font-size:.9em}
  footer{color:var(--ink2); font-size:.9rem; margin-top:28px; text-align:center}
  footer a{color:var(--ink2)}
  .meta{margin:0 0 12px}
  .fine{font-size:.92rem}
  .wrap.wide{max-width:64rem}
  .table-scroll{overflow-x:auto; margin:8px 0 20px}
  .table-scroll table{width:72rem; min-width:72rem; table-layout:fixed; border-collapse:collapse; font-size:.92rem}
  .table-scroll th:first-child{width:16rem; position:sticky; left:0; background:var(--surface); z-index:1; box-shadow:1px 0 0 var(--hairline)}
  .table-scroll code{word-break:break-word}
  table{width:100%; border-collapse:collapse; font-size:.92rem}
  caption{text-align:left; font-size:.92rem; color:var(--ink2); margin:0 0 10px; caption-side:bottom}
  th,td{border-bottom:1px solid var(--hairline); text-align:left; vertical-align:top; padding:10px 12px 10px 0}
  th{font-family:Outfit,sans-serif; font-weight:600; color:var(--ink); font-size:.84rem}
  .dev{color:var(--ink); font-size:.92rem}
  .bestfor{margin:8px 0 0}
  @media (max-width:520px){ body{font-size:16px} header{padding-top:36px} main{padding:4px 18px 22px} h1{font-size:1.6rem} }
  @media (max-width:640px){
    .table-scroll th:first-child{position:static; box-shadow:none}
  }
</style>
