<!doctype html>
<html lang="en">
<head>
{% include head.html %}
<style>
  .wrap.wide{max-width:64rem}
  .hero{padding:40px 0 8px; max-width:40rem}
  .hero h1{font-size:3rem; line-height:1.08; margin:0 0 16px}
  .hero h1 em{font-style:normal; color:var(--leaf-ink)}
  .hero .lede{font-size:1.2rem; margin:0 0 24px}
  .pill{display:inline-block; background:var(--leaf-soft); color:var(--leaf-ink); border-radius:999px; padding:6px 14px; font-size:.9rem; font-weight:600}
  .shots{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin:40px 0 8px}
  .shots img{width:100%; height:auto; display:block; border-radius:18px; border:1px solid var(--hairline); background:var(--surface)}
  .features{display:grid; grid-template-columns:repeat(2,1fr); gap:16px; margin-top:40px}
  .card{background:var(--surface); border:1px solid var(--hairline); border-radius:24px; padding:6px 24px 18px}
  .card h2{margin:18px 0 6px}
  .card p{margin:0 0 8px}
  .card.full{grid-column:1 / -1}
  .fine{font-size:.92rem}
  @media (max-width:820px){
    .shots{grid-template-columns:repeat(2,1fr)}
    .features{grid-template-columns:1fr}
  }
  @media (max-width:520px){
    .hero{padding-top:20px}
    .hero h1{font-size:2.2rem}
    .hero .lede{font-size:1.05rem}
    .shots{gap:10px}
    .shots img{border-radius:12px}
    .card{padding:4px 18px 14px}
  }
</style>
</head>
<body>
  <div class="wrap wide">
    <header>
      <a href="{{ '/' | relative_url }}">
        <img src="{{ '/assets/mark.svg' | relative_url }}" alt="">
        <span class="name">StandRight</span>
      </a>
    </header>
    {{ content }}
    <footer>
      Nothing leaves your phone. No account, no cloud, no ads.<br>
      <a href="{{ '/privacy-policy' | relative_url }}">Privacy policy</a>
    </footer>
  </div>
</body>
</html>
