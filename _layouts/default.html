<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }}</title>
<meta name="description" content="StandRight is a local-only Android posture reminder app. No account, no cloud, no ads.">
<link rel="icon" href="{{ '/assets/mark.svg' | relative_url }}" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#F6F1EA; --surface:#FFFDFA; --hairline:#E4D9C9;
    --ink:#2A231D; --ink2:#6B5D50; --leaf-ink:#3F6B34;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--canvas); color:var(--ink);
    font-family:Figtree,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:17px; line-height:1.65;
  }
  .wrap{max-width:44rem; margin:0 auto; padding:0 16px 96px}
  header{padding:56px 0 8px; display:flex; align-items:center; gap:14px}
  header img{width:46px; height:46px; display:block}
  header .name{font-family:Outfit,sans-serif; font-weight:600; font-size:1.6rem; letter-spacing:-.01em}
  main{background:var(--surface); border:1px solid var(--hairline); border-radius:24px; padding:8px 28px 28px; margin-top:28px}
  h1,h2,h3{font-family:Outfit,sans-serif; font-weight:600; letter-spacing:-.01em; line-height:1.25}
  h1{font-size:2rem; margin:24px 0 8px}
  h2{font-size:1.25rem; margin:32px 0 8px}
  p,li{color:var(--ink2)}
  a{color:var(--leaf-ink); text-underline-offset:3px}
  a:hover{text-decoration-thickness:2px}
  hr{border:0; border-top:1px solid var(--hairline); margin:32px 0}
  code{background:var(--canvas); padding:2px 6px; border-radius:6px; font-size:.9em}
  footer{color:var(--ink2); font-size:.9rem; margin-top:28px; text-align:center}
  @media (max-width:520px){ body{font-size:16px} header{padding-top:36px} main{padding:4px 18px 22px} h1{font-size:1.6rem} }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <img src="{{ '/assets/mark.svg' | relative_url }}" alt="">
      <span class="name">StandRight</span>
    </header>
    <main>{{ content }}</main>
    <footer>Nothing leaves your phone. No account, no cloud, no ads.</footer>
  </div>
</body>
</html>
